# RocksVision native packages (macOS arm64, macOS Intel x64, Ubuntu x64, Windows x64).
# ONE workflow, ONE shared build job, two modes chosen by the REF TYPE (github.ref_type):
#   tag    (push of a version tag, or Run workflow on a tag)
#          -> "Release packages (build, then create or upload release vX.Y.Z)"
#   branch (Run workflow on a branch) -> "Build test packages (artifacts only, no release)"
# The mode is shown in the run name, every job name and the run summary.
# `release: published` is NOT a trigger any more (task 0008): creating a release in the UI with
# a new tag also creates the tag, so both triggers would have started two runs for one release.
#
# Owner steps (ta2ldv):
#   Release: set Cargo.toml version to X.Y.Z (>= 0.1.1), commit, `git push`, then
#     `git tag vX.Y.Z && git push origin vX.Y.Z` (`git push` alone does NOT send local tags).
#     Or create the release in the GitHub UI with a NEW tag vX.Y.Z on the bumped commit: that
#     creates the tag, the tag push runs this workflow, which uploads to the existing release.
#   Test build: Actions > "Build and release packages" > Run workflow on a BRANCH (artifacts only).
#     Run workflow on a TAG takes the same release path as a tag push.
#   Partial upload / retry: see docs/BUILD.md "Recovery after a partial upload".
#
# Gating matrix:
#   branch push / pull request / schedule / release events -> no trigger, nothing runs
#   tag push not matching v<digits>.<digits>.<digits>      -> no trigger (filter below)
#   tag deletion                                          -> every job skipped
#   run/re-run by anyone but ta2ldv                       -> every job skipped (actor + triggering_actor)
#   Run workflow on a branch                              -> build/test/package + 7-day artifacts only
#   tag v0.1.0 or older (strict format)                   -> NEUTRAL SKIP: validate passes with a notice,
#                                                            nothing built or released
#   tag not strictly vMAJOR.MINOR.PATCH (e.g. v0.1.02)    -> validate FAILS, nothing built
#   tag != Cargo.toml version at the tagged commit        -> validate fails
#   tag on GitHub no longer at the built commit           -> fails (before builds and before any write)
#   draft release, immutable release, asset name exists   -> fails (before builds; re-checked before write)
#   GitHub API error/network failure on a check           -> fails closed (logged distinctly)
#   any platform build/test fails                         -> no release write at all
#   no release for the tag                                -> after all four pass: create it + 8 assets
#   published release exists (e.g. created in the UI)     -> after all four pass: upload 8 assets only;
#                                                            title/notes never edited
#   repository other than ta2ldv/rocksvision (fork)       -> no release write
#   runs for the same tag (push + manual, re-run)         -> serialized (concurrency group); the later one
#                                                            stops at "asset name exists"
#
# Immutable releases: a release published with immutable releases ON cannot get assets later, so
# the upload-only path refuses it (REST `immutable` must be false; field confirmed 2026-10-27).
# The create path passes the assets to `gh release create`, which (per gh, to verify on the first
# real run) creates a draft, uploads and then publishes; the result is verified afterwards.
#
# Runner labels (checked against actions/runner-images README, 2026-10-24): macos-13 is retired;
# macos-15-intel is the x86_64 macOS image, macos-15 the arm64 one (macos-14 is deprecated).
# Action revisions are pinned by commit SHA (tag in the comment, looked up via git ls-remote).

name: Build and release packages

run-name: >-
  ${{ github.ref_type == 'tag'
  && format('Release packages (build, then create or upload release {0}) [{1}] @ {2}', github.ref_name, github.event_name, github.sha)
  || format('Build test packages (artifacts only, no release) on {0} @ {1}', github.ref_name, github.sha) }}

on:
  push:
    # Only version-like tags start a run (anchored glob, `+` = one or more); validate-tag.sh then
    # applies the strict rule. No `branches:` filter, so branch pushes never trigger.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a tag push and a manual run on the same tag (or a re-run) queue behind each
# other, never in parallel and never cancelled midway. Branch builds use their own groups.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'release' || 'build' }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    # Tag deletions also arrive as push events (deleted == true): never build for those.
    if: >-
      github.actor == 'ta2ldv' && github.triggering_actor == 'ta2ldv' &&
      github.event.deleted != true
    name: ${{ github.ref_type == 'tag' && 'Release packages / validate tag, version and release' || 'Build test packages / resolve source (no release)' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      proceed: ${{ steps.mode.outputs.proceed }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # github.sha: the tagged commit (tag mode) or the branch tip at dispatch time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source (commit pinned for all later jobs)
        id: src
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "error: checkout $sha != github.sha $GITHUB_SHA" >&2; exit 1; }
          printf 'event: %s\nref: %s\nsha: %s\n' "$EVENT" "$REF" "$sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      # Tag mode: strict tag >= 0.1.1 equal to Cargo.toml of this commit. Exit 10 (older than
      # 0.1.1) is a neutral skip: this job passes, proceed=false skips every other job.
      - name: Mode and tag validation (tag must equal Cargo.toml at the tagged commit)
        id: mode
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          proceed=true
          if [ "$REF_TYPE" = tag ]; then
            rc=0
            bash scripts/ci/validate-tag.sh "$TAG" || rc=$?
            case "$rc" in
              0) ;;
              10)
                proceed=false
                echo "::notice::Tag $TAG is older than v0.1.1: skipped, nothing is built or released."
                printf '## Release packages: SKIPPED (%s)\n\nTag %s is older than v0.1.1; old tags are never processed. Nothing was built or released.\n' "$TAG" "$TAG" >>"$GITHUB_STEP_SUMMARY"
                ;;
              *) exit "$rc" ;;
            esac
          fi
          echo "proceed=$proceed" >>"$GITHUB_OUTPUT"
      # Lightweight and annotated tags: GET git/ref/tags/<tag>; an annotated tag object is peeled
      # once via git/tags/<sha> (commits/tags/<tag> answers 422 for annotated tags, run 41229922521).
      - name: Tag still points to this commit (tag mode, fail-closed)
        if: github.ref_type == 'tag' && steps.mode.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.src.outputs.sha }}
        run: bash scripts/ci/check-tag-commit.sh "$REPO" "$TAG" "$SHA"
      # Exit 0 = published release exists (upload-only), 10 = no release (create), anything else
      # stops here, before any build. Re-checked with the write token right before the write.
      - name: Release plan (create or upload-only; draft/immutable/existing asset stop; fail-closed)
        id: plan
        if: github.ref_type == 'tag' && steps.mode.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          names=()
          for f in "rocksvision-$v-macos-arm64.zip" "rocksvision-$v-macos-x64.zip" \
            "rocksvision-$v-ubuntu-x64.tar.gz" "rocksvision-$v-windows-x64.zip"; do
            names+=("$f" "$f.sha256")
          done
          rc=0
          bash scripts/ci/check-release-ready.sh "$REPO" "$TAG" "${names[@]}" || rc=$?
          case "$rc" in
            0) plan=upload-only ;;
            10) plan=create ;;
            *) exit "$rc" ;;
          esac
          echo "plan=$plan" >>"$GITHUB_OUTPUT"
      - name: Run summary (mode)
        if: steps.mode.outputs.proceed == 'true'
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ steps.src.outputs.sha }}
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            mode="Release packages (build, then create or upload release $REF)"
            case "$PLAN" in
              create) what="no release exists yet: CREATE release $REF (minimal notes) with the eight assets" ;;
              *) what="release $REF exists: UPLOAD the eight assets only (its title and notes are never edited)" ;;
            esac
            note="Trigger: $EVENT. Builds commit $SHA of tag $REF on all four platforms; only after all four pass: $what (decided again right before the write). Never overwrites an asset."
          else
            mode="Build test packages (artifacts only, no release)"
            note="Builds ref $REF at $SHA on all four platforms; 7-day artifacts only. No release is created, read or changed."
          fi
          echo "$mode"
          echo "$note"
          printf '## %s\n\n%s\n' "$mode" "$note" >>"$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    if: >-
      github.actor == 'ta2ldv' && github.triggering_actor == 'ta2ldv' &&
      needs.validate.outputs.proceed == 'true'
    name: ${{ github.ref_type == 'tag' && 'Release packages' || 'Build test packages' }} / ${{ matrix.platform }} (${{ matrix.runner }}; build, cargo test, CLI smoke)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
            build: sh scripts/build-macos-arm64.sh
            test_args: ''
            bin: dist/macos-arm64/RocksVision.app/Contents/MacOS/rocksvision
          - platform: macos-x64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
            build: sh scripts/build-macos-x64.sh
            test_args: --target x86_64-apple-darwin
            bin: dist/macos-x64/RocksVision.app/Contents/MacOS/rocksvision
          - platform: ubuntu-x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            build: bash scripts/build-ubuntu-x64.sh
            test_args: --target x86_64-unknown-linux-gnu
            bin: dist/ubuntu-x64/rocksvision
          - platform: windows-x64
            runner: windows-2022
            triple: x86_64-pc-windows-msvc
            build: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-x64.ps1
            test_args: --target x86_64-pc-windows-msvc
            bin: dist/windows-x64/rocksvision.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Source and versions
        id: meta
        env:
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          rust=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -n1)
          [ -n "$version" ] && [ -n "$rust" ]
          printf 'sha: %s\nversion: %s\nrust: %s\n' "$SHA" "$version" "$rust"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "rust=$rust" >>"$GITHUB_OUTPUT"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triple }}-rust${{ steps.meta.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triple }}-rust${{ steps.meta.outputs.rust }}-
      # Same one-command scripts as local builds. Unattended: rustup is preinstalled or bootstrapped
      # by the script, apt uses passwordless sudo -n, the Windows image already has the VS 2022
      # MSVC toolset (vswhere finds it, the Build Tools installer is skipped).
      - name: Build and package (platform script, unattended)
        run: ${{ matrix.build }}
      - name: Check dist (version, target, LICENSE, checksums)
        run: bash scripts/ci/check-dist.sh "${{ matrix.platform }}" "${{ matrix.triple }}"
      # rust-toolchain.toml uses profile "minimal" (no clippy/rustfmt): the components are added
      # here (idempotent), not in the packaging scripts. Same target handling as Test.
      - name: Lint (cargo fmt --check, cargo clippy -D warnings)
        env:
          RUST: ${{ steps.meta.outputs.rust }}
          TEST_ARGS: ${{ matrix.test_args }}
        # shellcheck disable=SC2086
        run: |
          rustup component add clippy rustfmt --toolchain "$RUST"
          rustup run "$RUST" cargo fmt --check
          rustup run "$RUST" cargo clippy --all-targets --locked $TEST_ARGS -- -D warnings
          rustup run "$RUST" cargo clippy --all-targets --locked --features harness $TEST_ARGS -- -D warnings
      # All four platforms: the suite verifies checksums in pure Rust (no shasum).
      - name: Test (cargo test --release --locked)
        env:
          RUST: ${{ steps.meta.outputs.rust }}
          TEST_ARGS: ${{ matrix.test_args }}
        # shellcheck disable=SC2086
        run: rustup run "$RUST" cargo test --release --locked $TEST_ARGS
      # Same bash lines on all four runners (defaults.run.shell = bash; Git Bash on Windows).
      # Output goes to a file first: a pipe into `head` under pipefail killed the producer with
      # SIGPIPE on macos-15-intel ("printf: write error: Broken pipe"). Reading a file never does.
      - name: CLI smoke (--dump of a bundled WAL; not GUI evidence)
        env:
          BIN: ${{ matrix.bin }}
          FIXTURE: examples/files/wal-plain/000004.log
        run: |
          dump=$(mktemp)
          rc=0
          "$BIN" --dump "$FIXTURE" >"$dump" || rc=$?
          [ "$rc" -eq 0 ] || { echo "error: --dump exited with $rc" >&2; exit 1; }
          [ -s "$dump" ] || { echo "error: --dump printed nothing" >&2; exit 1; }
          grep -q 'WAL file' "$dump" || { echo "error: --dump output lacks the 'WAL file' marker" >&2; exit 1; }
          echo "--dump ok: $(wc -l <"$dump" | tr -d ' ') lines; first 5:"
          head -n 5 "$dump"
      - name: Upload artifacts (7 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocksvision-${{ matrix.platform }}
          path: dist/rocksvision-${{ steps.meta.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  # Runs only when validate AND all four matrix builds succeeded (implicit success() of needs).
  release-assets:
    needs: [validate, build]
    if: >-
      github.ref_type == 'tag' &&
      needs.validate.outputs.proceed == 'true' &&
      github.repository == 'ta2ldv/rocksvision' &&
      github.actor == 'ta2ldv' && github.triggering_actor == 'ta2ldv'
    name: Release packages / ${{ needs.validate.outputs.plan == 'create' && 'create release' || 'upload to existing release' }} ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rocksvision-*
          path: release-assets
          merge-multiple: true
      - name: Verify the eight release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          cd release-assets
          want="rocksvision-$v-macos-arm64.zip rocksvision-$v-macos-x64.zip rocksvision-$v-ubuntu-x64.tar.gz rocksvision-$v-windows-x64.zip"
          n=0
          for f in $want; do
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "error: $f or $f.sha256 missing" >&2; exit 1; }
            tr -d '\r' <"$f.sha256" | sha256sum -c -
            n=$((n + 2))
          done
          [ "$(find . -type f | wc -l)" -eq "$n" ] || { echo "error: unexpected extra files:" >&2; ls -la >&2; exit 1; }
      # publish-release.sh re-checks tag commit and release state in the SAME step, right before
      # the write (decided again here, not taken from the validate plan: a release may have been
      # created in between). Absent -> gh release create --verify-tag + assets; present ->
      # gh release upload (no --clobber, title/notes untouched); otherwise stop. Then verifies all
      # eight assets are attached. A failure part way leaves what was uploaded; a retry stops at
      # the check (recovery: docs/BUILD.md "Recovery after a partial upload").
      - name: Re-check, then create the release or upload to the existing one (no overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: bash scripts/ci/publish-release.sh "$REPO" "$TAG" "$SHA" release-assets
